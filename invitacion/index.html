<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumpleaños de MAKO · 41 Años</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --black:#0a0a0a;
    --black2:#161513;
    --gold:#c9a86a;
    --gold2:#e8caa0;
    --cream:#f4efe4;
    --muted:#9a9689;
    --shadow:0 18px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;width:100%;height:100%;background:var(--black);font-family:'Manrope',sans-serif;overflow:hidden;}
  .stage{
    position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;
    background:
      radial-gradient(circle at 50% 15%, rgba(201,168,106,.14), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(201,168,106,.08), transparent 60%),
      var(--black);
  }
  .diamonds{
    position:absolute;inset:0;z-index:0;opacity:.5;pointer-events:none;
    background-image:
      linear-gradient(45deg, rgba(201,168,106,.06) 25%, transparent 25%, transparent 75%, rgba(201,168,106,.06) 75%),
      linear-gradient(45deg, rgba(201,168,106,.06) 25%, transparent 25%, transparent 75%, rgba(201,168,106,.06) 75%);
    background-size:34px 34px;background-position:0 0, 17px 17px;
  }
  .content{
    position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:calc(28px + env(safe-area-inset-top)) 26px calc(30px + env(safe-area-inset-bottom));
    gap:14px;
  }
  .crown{font-size:22px;color:var(--gold);letter-spacing:.3em;margin-bottom:2px;}
  .eyebrow{
    font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;letter-spacing:.32em;
    color:var(--muted);text-transform:uppercase;
  }
  .script{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:clamp(30px,7.5vw,46px);color:var(--gold2);margin:2px 0 0;
    background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .name{
    font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:.02em;
    font-size:clamp(52px,17vw,108px);color:var(--cream);margin:2px 0;line-height:.92;
  }
  .age-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px;}
  .age-num{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(30px,7vw,42px);color:var(--gold);}
  .age-label{font-size:12px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;}
  .rule{width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:6px 0;}

  .countdown{display:flex;gap:10px;margin:14px 0 4px;}
  .cd-box{
    min-width:58px;padding:10px 8px;border:1px solid rgba(201,168,106,.35);border-radius:12px;
    background:rgba(201,168,106,.06);backdrop-filter:blur(6px);
  }
  .cd-num{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;color:var(--gold2);}
  .cd-lbl{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:2px;}

  .details{font-size:13px;color:var(--muted);line-height:1.7;margin-top:6px;}
  .details b{color:var(--cream);font-weight:700;}

  .enter{
    margin-top:20px;display:inline-flex;align-items:center;gap:8px;
    padding:14px 30px;border:1px solid var(--gold);border-radius:999px;
    color:var(--black);background:linear-gradient(90deg,var(--gold),var(--gold2));
    font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    text-decoration:none;box-shadow:var(--shadow);transition:transform .2s ease;
  }
  .enter:active{transform:scale(.97);}
  .footer-line{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:16px;}
</style>
</head>
<body>
<div class="stage">
  <div class="diamonds"></div>
  <div class="content">
    <div class="crown">♛</div>
    <div class="eyebrow">Estás invitado al</div>
    <div class="script">Cumpleaños de</div>
    <div class="name">MAKO</div>
    <div class="age-row">
      <div class="age-num">41</div>
      <div class="age-label">Años</div>
    </div>
    <div class="rule"></div>

    <div class="countdown" id="countdown">
      <div class="cd-box"><div class="cd-num" id="cd-d">--</div><div class="cd-lbl">Días</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-h">--</div><div class="cd-lbl">Horas</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-m">--</div><div class="cd-lbl">Min</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-s">--</div><div class="cd-lbl">Seg</div></div>
    </div>

    <div class="details">
      <b>Sábado 29 de agosto</b> · 8:00 PM<br>
      En su casa, <b>Parrish, Florida</b>
    </div>

    <a class="enter" href="rsvp.html">Confirmar asistencia →</a>
    <div class="footer-line">Música · Amigos · Risas · Recuerdos</div>
  </div>
</div>

<script>
  // Fecha del evento: sábado 29 de agosto 2026, 8:00 PM (hora local del evento)
  const EVENT_DATE = new Date("2026-08-29T20:00:00");

  function tick(){
    const now = new Date();
    let diff = EVENT_DATE - now;
    if(diff < 0) diff = 0;
    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff / (1000*60*60)) % 24);
    const m = Math.floor((diff / (1000*60)) % 60);
    const s = Math.floor((diff / 1000) % 60);
    document.getElementById('cd-d').textContent = d;
    document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
    document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
    document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
